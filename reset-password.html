<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Şifre sıfırla | HaKING AI</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/img/favicon.png?v=4" />
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png?v=4" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/recovery.css" />
</head>
<body>
  <main class="recovery-page">
    <section class="recovery-card" aria-labelledby="recovery-title">
      <a class="recovery-brand" href="./index.html"><img src="./assets/img/logo-mark.webp?v=4" alt="" /><span>HaKING <b>AI</b></span></a>
      <span class="recovery-eyebrow">HESAP GÜVENLİĞİ</span>
      <h1 id="recovery-title">Yeni şifreni belirle</h1>
      <p class="recovery-intro">E-posta bağlantısı tek kullanımlıktır. Yeni şifren en az 8 karakter olmalı.</p>
      <form id="reset-password-form" class="recovery-form" novalidate>
        <label for="new-password">Yeni şifre</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="En az 8 karakter" />
        <label for="confirm-password">Yeni şifreyi doğrula</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Şifreni yeniden gir" />
        <button id="reset-password-submit" class="recovery-primary" type="submit">Şifremi güncelle</button>
      </form>
      <p id="recovery-status" class="recovery-status" role="status" aria-live="polite"></p>
      <a class="recovery-back" href="./index.html">Giriş ekranına dön</a>
    </section>
  </main>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/reset-password.js"></script>
</body>
</html>
