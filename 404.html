<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Sayfa bulunamadı | HaKING AI</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/img/favicon.png?v=4" />
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png?v=4" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/privacy.css" />
  <style>
    .not-found { display:grid; min-height:calc(100svh - 40px); place-items:center; }
    .not-found-card { width:min(620px,100%); padding:clamp(28px,6vw,52px); border:1px solid var(--border); border-radius:24px; background:rgba(17,20,28,.86); text-align:center; }
    .not-found-code { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.18em; }
    .not-found h1 { margin:14px 0; font:800 clamp(38px,8vw,64px)/1.05 "Manrope","DM Sans",sans-serif; letter-spacing:-.05em; }
    .not-found p { color:var(--text-soft); line-height:1.7; }
    .not-found a { display:inline-flex; margin-top:12px; padding:11px 16px; border:1px solid var(--border-strong); border-radius:12px; background:var(--surface-raised); color:var(--text); text-decoration:none; }
  </style>
</head>
<body>
  <main class="not-found">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <span class="not-found-code">404 · SAYFA BULUNAMADI</span>
      <h1 id="not-found-title">Bu sayfa yok.</h1>
      <p>Adres değişmiş veya kaldırılmış olabilir. Ana sayfaya dönüp HaKING AI'yi kullanmaya devam edebilirsin.</p>
      <a href="/">HaKING AI ana sayfasına dön <span aria-hidden="true">&nbsp;→</span></a>
    </section>
  </main>
</body>
</html>
